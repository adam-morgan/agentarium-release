name: Build
run-name: Build ${{ github.event.client_payload.tag || inputs.tag }}

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag in FalcorX/agentarium to build, like v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.client_payload.tag || inputs.tag }}

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          all='[
            {"name": "linux", "os": "ubuntu-latest", "targets": "--linux --x64"},
            {"name": "mac", "os": "macos-latest", "targets": "--mac"},
            {"name": "windows", "os": "windows-latest", "targets": "--win"}
          ]'
          matrix=$(jq -c --arg want "${PLATFORMS:-linux}" \
            '[.[] | select(.name as $n | $want | split(" ") | index($n))]' <<<"$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          PLATFORMS: ${{ vars.PLATFORMS }}
      # One draft for every platform's build to upload into; each making its
      # own at once would leave several.
      - name: Make the release's draft
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes '' --target main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@v5
        with:
          repository: FalcorX/agentarium
          ref: ${{ env.TAG }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      # codeArIum's npm scripts are written for bash.
      - if: runner.os == 'Windows'
        run: npm config set script-shell 'C:\Program Files\Git\bin\bash.exe'
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - if: runner.os != 'Linux'
        run: pip install --quiet --upgrade castlabs-evs
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: node apps/desktop/set-version.ts "${TAG#v}"
      - run: npm run build
      - working-directory: apps/desktop
        run: node build.ts && node stage.ts && npx electron-builder ${{ matrix.targets }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      # The server on its own, which the Windows app runs inside WSL.
      - if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          node server-bundle.ts
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/codearium-server-linux-x64.tar.gz \
            release/codearium-server-linux-x64.tar.gz.sha512
        env:
          GH_TOKEN: ${{ github.token }}

  # electron-builder uploads into a draft, so nobody gets a half-built release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft, with the title and notes it was sent
        run: |
          printf '%s\n' "$NOTES" > notes.md
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --title "${TITLE:-$TAG}" --notes-file notes.md "${pre[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.client_payload.title }}
          NOTES: ${{ github.event.client_payload.notes }}
